name: Infrastructure checks
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full check (build + isolated smoke suite) once, on the primary runtime.
          - os: ubuntu-latest
            node: 24
            script: npm run check
          # Windows build path (vite/esbuild/tsc emit) plus unit tests.
          - os: windows-latest
            node: 24
            script: npm run typecheck && npm test && npm run build
          # Newer Node compatibility: type check plus unit tests.
          - os: ubuntu-latest
            node: 26
            script: npm run typecheck && npm test
          - os: windows-latest
            node: 26
            script: npm run typecheck
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: ${{ matrix.script }}
